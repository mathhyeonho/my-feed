site:
  title: "My Feed"
  description: "자동 수집 · AI 정리 피드"
  url: "https://mathhyeonho.github.io/my-feed"
  language: "ko"
  max_posts: 500   # 누적 최대 포스트 수

sources:
  # ── RSS 소스 ──────────────────────────────────────────────────────────────
  - name: "Hacker News"
    type: "rss"
    url: "https://news.ycombinator.com/rss"
    count: 5

  # ── 신규상장주 트래커 ─────────────────────────────────────────────────────
  - name: "신규상장주 트래커"
    type: "ipo_tracker"
    interval: "daily"

    # KIS API 인증 (환경변수 KIS_APP_KEY / KIS_APP_SECRET 사용 권장)
    # kis_app_key: ""
    # kis_app_secret: ""

    # 조회할 거래소 (해외: NASD NYSE AMEX SEHK SHAA SZAA TKSE HASE VNSE / 국내: KOSPI KOSDAQ)
    markets:
      # 해외 (KIS 마켓 코드)
      - nas   # NASDAQ
      - nys   # NYSE
      - ams   # AMEX
      - hks   # 홍콩
      - shs   # 상해
      - szs   # 심천
      - tse   # 도쿄
      - hnx   # 하노이 (베트남)
      - hsx   # 호치민 (베트남)
      # 국내 (KIS API 인증 필요)
      - KOSPI
      - KOSDAQ

    ipo_days: 21              # 거래일수 임계값 (이 수치 미만이면 신규상장 후보)
    max_listing_age_days: 45  # 첫 거래일이 오늘로부터 이 일수 이내여야 신규상장으로 인정
                              # (21 거래일 ≈ 30 달력일 + 여유 15일 / 상폐 종목 필터링용, 휴일 영향 없음)
    cache_days: 30            # 비-신규상장 티커 캐시 유지 기간 (일)
    batch_size: 50        # yfinance 1회 배치 요청 종목 수
    batch_delay: 0.5      # 배치 간 대기 시간 (초, 레이트리밋 방지)

  # ── Highcharts 차트 소스 ───────────────────────────────────────────────────
  - name: "거시경제 지표"
    type: "highcharts"
    interval: "weekly"                 # daily | weekly | monthly
    html_file: "data/nasdaq_pe.html"
    source_url: "https://en.macromicro.me/series/23955/nasdaq-100-pe"

  # ── REST API 소스 ─────────────────────────────────────────────────────────
  # - name: "My API"
  #   type: "api"
  #   url: "https://api.example.com/posts"
  #   method: GET
  #   count: 10
  #   items_path: "data.items"    # 응답 JSON 내 배열 위치 (점 구분)
  #   id_field:      "id"         # 고유 식별자 필드
  #   title_field:   "title"      # 제목 필드
  #   url_field:     "link"       # 원문 URL 필드
  #   content_field: "body"       # 본문 필드
  #   date_field:    "created_at" # 날짜 필드 (선택)
  #   headers:
  #     Authorization: "Bearer YOUR_TOKEN"
  #   params:
  #     page: 1

  # ── 웹 스크래퍼 소스 ──────────────────────────────────────────────────────
  # - name: "My Blog"
  #   type: "scraper"
  #   url: "https://example.com/blog"
  #   count: 5
  #   item_selector:    "article"
  #   title_selector:   "h2"
  #   link_selector:    "a"
  #   content_selector: "p"

llm:
  enabled: false            # true 로 변경하면 AI 요약 활성화

  provider: "anthropic"     # anthropic | openai | google | deepseek | ollama
  model: ""                 # 비우면 각 프로바이더 기본값 사용
                            #   anthropic → claude-haiku-4-5-20251001
                            #   openai    → gpt-4o-mini
                            #   google    → gemini-2.0-flash
                            #   deepseek  → deepseek-chat
                            #   ollama    → llama3.2

  language: "ko"
  max_items_per_run: 10     # 비용/속도 조절용 상한선

  # 시스템 프롬프트 커스터마이즈 (선택, 비우면 기본값)
  # system_prompt: |
  #   당신은 ...

  # Ollama 전용 옵션
  # host: "http://localhost:11434"

output:
  dir: "docs"
