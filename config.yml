llm:
  enabled: false            # true 로 변경하면 AI 요약 활성화

  provider: "anthropic"     # anthropic | openai | google | deepseek | ollama
  model: ""                 # 비우면 각 프로바이더 기본값 사용
                            #   anthropic → claude-haiku-4-5-20251001
                            #   openai    → gpt-4o-mini
                            #   google    → gemini-2.0-flash
                            #   deepseek  → deepseek-chat
                            #   ollama    → llama3.2

  language: "ko"
  max_items_per_run: 10     # 비용/속도 조절용 상한선

  # 시스템 프롬프트 커스터마이즈 (선택, 비우면 기본값)
  # system_prompt: |
  #   당신은 ...

  # Ollama 전용 옵션
  # host: "http://localhost:11434"

output:
  dir: "docs"
