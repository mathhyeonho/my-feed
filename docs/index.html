<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Feed</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f4f4f5; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .box { background: #fff; border-radius: 12px; padding: 48px 40px; text-align: center;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 400px; }
    h1 { font-size: 1.4rem; color: #18181b; margin-bottom: 12px; }
    p  { color: #71717a; font-size: .95rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>My Feed</h1>
    <p>피드 수집이 시작되면 여기에 콘텐츠가 표시됩니다.</p>
  </div>
</body>
</html>
