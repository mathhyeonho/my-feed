name: Update Feed

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 UTC 00:00 = KST 09:00
  workflow_dispatch:
    inputs:
      force:
        description: "모든 소스 강제 실행 (interval 무시)"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          KIS_APP_KEY:       ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:    ${{ secrets.KIS_APP_SECRET }}
        run: python main.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit & push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add docs/
          [ -f data/ipo_cache.json ] && git add data/ipo_cache.json || true
          git diff --staged --quiet || git commit -m "feed: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
